version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than 7 days
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Breaking upgrades are deliberate choices, made by hand
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 0.x crates: a minor bump is breaking under Cargo semver
      - dependency-name: chrono
        update-types: ["version-update:semver-minor"]
      - dependency-name: ron
        update-types: ["version-update:semver-minor"]
      - dependency-name: serde_yaml
        update-types: ["version-update:semver-minor"]
      - dependency-name: sha2
        update-types: ["version-update:semver-minor"]
      - dependency-name: tracing
        update-types: ["version-update:semver-minor"]
    groups:
      cargo:
        patterns: ["*"]
