# One version, one vX.Y.Z tag, one GitHub Release and one CHANGELOG.md for the whole workspace.
[workspace]
# Not on crates.io: versions come from git tags, and cargo publish is skipped
git_only = true
publish = false
# Release only when the release PR is merged
release_always = false
# No crate is published, so its Rust API is not the public interface: CONTRIBUTING.md (Versioning)
# defines that, and the commits say when it breaks. Turn this back on for a crate if it is ever published.
semver_check = false
changelog_path = "./CHANGELOG.md"
changelog_update = false
git_tag_enable = false
git_release_enable = false
# Every crate finds its previous release at the shared vX.Y.Z tag; without this, git-only mode looks
# for <crate>-vX.Y.Z, never finds one, and changelog_include skips that crate's commits.
git_tag_name = "v{{ version }}"

# The release is named after the server; the other crates' commits are folded into its changelog.
[[package]]
name = "kb-mcp-server"
version_group = "kb"
changelog_update = true
changelog_include = ["kb-core", "kb-cli"]
git_tag_enable = true
git_release_enable = true
git_release_name = "v{{ version }}"

[[package]]
name = "kb-core"
version_group = "kb"

[[package]]
name = "kb-cli"
version_group = "kb"
