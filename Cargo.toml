[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/ttdonovan/kb-mcp"
homepage = "https://ttdonovan.github.io/kb-mcp/"
# Released from git tags (vX.Y.Z), not crates.io
publish = false

# Every crate opts in with `[lints] workspace = true`; clippy.toml allows panics in tests.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
